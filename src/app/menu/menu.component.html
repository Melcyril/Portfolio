
<div class="presentation" id="presentation">

    <div class="identite">

        <a class="nom" href="https://melcyril.github.io/Portfolio/">
            <span class="partie mel">Mel</span><span class="partie cy">Cy</span><span class="partie dev">Dev</span>
        </a>

        <span class="specialite">
            DEVELOPPEUR WEB
        </span>

    </div>

    <ul class="navbar" [style.display]="showMenu ? 'none' : 'flex'">

        <li>
            <a class="menuLien"
               (click)="scrollTo('about')"
               [class.active]="activeLink === 'about'">
                À propos
            </a>
        </li>

        <li>
            <a class="menuLien"
               (click)="scrollTo('skills')"
               [class.active]="activeLink === 'skills'">
                Compétences
            </a>
        </li>

        <li>
            <a class="menuLien"
               (click)="scrollTo('projet')"
               [class.active]="activeLink === 'projet'">
                Projets
            </a>
        </li>

        <li>
            <a class="menuLien"
               (click)="scrollTo('interet')"
               [class.active]="activeLink === 'interet'">
                Centres d'intérêts
            </a>
        </li>

        <li>
            <a class="menuLien"
               (click)="scrollTo('contact')"
               [class.active]="activeLink === 'contact'">
                Contact
            </a>
        </li>

    </ul>

    <button
        class="menu-button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="!showMenu"
        aria-label="Ouvrir ou fermer le menu">

        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>

    </button>

</div>
