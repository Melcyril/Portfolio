<div class="apropos-navigation section-content">

    <div class="apropos-contenu">

        <app-about
            [@fadeInOut]="showDiv ? 'in' : 'out'"
            *ngIf="showDiv">
        </app-about>

        <app-fullstack
            [@fadeInOut]="showDiv ? 'out' : 'in'"
            *ngIf="!showDiv">
        </app-fullstack>

    </div>

    <button
        class="navigationProjet previous"
        *ngIf="showDiv"
        (click)="onToggle(1)"
        aria-label="Précédent">
        <span>&#10094;</span>
    </button>

    <button
        class="navigationProjet next"
        *ngIf="!showDiv"
        (click)="onToggle(2)"
        aria-label="Suivant">
        <span>&#10095;</span>
    </button>

</div>
