<app-about [@fadeInOut]="showDiv ? 'in' : 'out'" *ngIf="showDiv"></app-about>
<app-fullstack [@fadeInOut]="showDiv ? 'out' : 'in'" *ngIf="!showDiv"></app-fullstack>

<div class="navigationDiv">
    <button
        class="navigationProjet previous"
        *ngIf="showDiv"
        (click)="onToggle(1)"
        aria-label="Précédent"
        title="Précédent">
        &lt;
    </button>

    <button
        class="navigationProjet next"
        *ngIf="!showDiv"
        (click)="onToggle(2)"
        aria-label="Suivant"
        title="Suivant">
        &gt;
    </button>
</div>
