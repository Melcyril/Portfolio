
<hr class="hr-line" id="projet">

<section class="projet" #madivRef>

    <h2>
        {{ mesProjets.length + " " }}projets réalisés :
    </h2>

    <!-- Navigation entre les projets -->

    <div class="navigationProjetDiv">

        <button
            class="navigationProjet previous"
            (click)="showPreviousProjets()"
            [style.display]="startIndex === 0 ? 'none' : 'block'"
            aria-label="Projet précédent">

            &lt;

        </button>

        <button
            class="navigationProjet next"
            (click)="showNextProjets()"
            [style.display]="startIndex >= mesProjets.length - 1 ? 'none' : 'block'"
            aria-label="Projet suivant">

            &gt;

        </button>

    </div>

    <!-- Liste des projets -->

    <div class="mesprojets">

        <ng-container *ngFor="let projet of mesProjets">

            <!-- Seul le projet sélectionné est créé dans le DOM -->

            <article
                class="monprojet"
                *ngIf="projet.id === startIndex">

                <div
                    class="projetOpacity"
                    [style.opacity]="opacityProjet">

                    <h5>
                        Projet {{ projet.id + 1 }}
                    </h5>

                    <!-- Image du projet -->

                    <div class="image-container">

                        <p>

                            <img
                                class="imgComputer"
                                src="assets/compute.png"
                                alt="Ordinateur présentant le projet">

                            <img
                                class="imgProjet"
                                src="assets/ordi.jpg"
                                [attr.alt]="'Capture du projet ' + (projet.id + 1)">

                        </p>

                        <!-- Overlay lorsque les détails sont fermés -->

                        <div
                            class="overlay texte"
                            *ngIf="!projet.detailsVisible"
                            @fadeInOut>

                            <h4>
                                {{ projet.titre }}
                            </h4>

                            <a
                                class="menuLien orange"
                                (click)="afficherDetails(projet)">

                                -&gt; Voir détails &lt;-

                            </a>

                        </div>

                        <!-- Overlay lorsque les détails sont ouverts -->

                        <div
                            class="overlay texte"
                            *ngIf="projet.detailsVisible"
                            @fadeInOut>

                            <h4>
                                {{ projet.titre }}
                            </h4>

                        </div>

                    </div>

                    <!-- Informations détaillées -->

                    <div
                        class="details-projet"
                        *ngIf="projet.detailsVisible"
                        @fadeInOut>

                        <h3>
                            {{ projet.titre }}
                        </h3>

                        <p class="orange vert">
                            Technologie(s) utilisée(s)
                        </p>

                        <p class="data-projet">
                            {{ projet.technologie }}
                        </p>

                        <p class="orange">
                            Description
                        </p>

                        <p class="data-projet">
                            {{ projet.description }}
                        </p>

                        <h3 *ngIf="projet.lien !== ''">
                            Lien
                        </h3>

                        <p *ngIf="projet.lien !== ''">

                            <a
                                [href]="projet.lien"
                                target="_blank"
                                rel="noopener noreferrer">

                                {{ projet.lien }}

                            </a>

                        </p>

                        <!-- Bouton fermer -->

                        <a
                            class="close copyright"
                            role="button"
                            tabindex="0"
                            (click)="fermerDetails(projet)"
                            (keydown.enter)="fermerDetails(projet)">

                            <p
                                (mouseenter)="ajouterTremble()"
                                (mouseleave)="retirerTremble()"
                                [class.tremble]="tremble">

                                FERMER

                            </p>

                        </a>

                    </div>

                </div>

            </article>

        </ng-container>

    </div>

</section>
